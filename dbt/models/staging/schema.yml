version: 2

models:
  - name: stg_fragments
    description: One row per fragment, order_no as an integer, duplicates removed.
    columns:
      - name: order_no
        description: Position of the word in the phrase (1 to 21).
        data_tests:
          - not_null
          - unique
      - name: word
        description: The word, with spaces trimmed.
        data_tests:
          - not_null
